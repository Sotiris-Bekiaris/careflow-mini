# Default values for careflow-mini
replicaCount: 1

image:
  registry: ghcr.io
  repository: Sotiris-Bekiaris/careflow-mini
  pullPolicy: IfNotPresent
  tag: "latest"

# API Gateway configuration
apiGateway:
  enabled: true
  port: 8080
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "200m"

# Patient Service configuration
patientSvc:
  enabled: true
  port: 50051
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "200m"

# Appointment Service configuration
appointmentSvc:
  enabled: true
  port: 50052
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "200m"

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    username: careflow
    password: careflow
    database: careflow

# NATS configuration
nats:
  enabled: true
  port: 4222

# Observability
jaeger:
  enabled: true
  endpoint: http://jaeger-collector:14268/api/traces

prometheus:
  enabled: true

grafana:
  enabled: true
  adminPassword: admin
